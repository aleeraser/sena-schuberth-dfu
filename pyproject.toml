[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "schuberth-dfu"
version = "0.1.0"
description = "Linux firmware updater for SCHUBERTH/SENA motorcycle headsets (reverse-engineered)"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = [
    "hidapi>=0.14; sys_platform == 'linux'",
    "pyusb>=1.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
schuberth-dfu = "schuberth_dfu.cli:main"

[tool.setuptools]
packages = ["schuberth_dfu"]

[tool.setuptools.package-data]
schuberth_dfu = ["data/*.csv"]
